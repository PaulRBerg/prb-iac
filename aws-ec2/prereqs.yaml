AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Shared prerequisites for prb-agents stacks.
  Deploy once — security group and IAM instance profile are reused across stack updates.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0dd3061076bccd5b6
    Description: VPC for the security group

Resources:
  # ---------------------------------------------------------------------------
  # Security Group — SSH only (Tailscale handles the real access layer)
  # ---------------------------------------------------------------------------
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: prb-agents — SSH ingress
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: prb-agents-sg

  # ---------------------------------------------------------------------------
  # IAM Role + Instance Profile — SSM Session Manager access
  # ---------------------------------------------------------------------------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: prb-agents-instance-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: prb-agents-instance-profile
      Roles:
        - !Ref InstanceRole

Outputs:
  SecurityGroupId:
    Value: !GetAtt SecurityGroup.GroupId
    Export:
      Name: prb-agents-sg-id
  InstanceProfileName:
    Value: !Ref InstanceProfile
    Export:
      Name: prb-agents-instance-profile
