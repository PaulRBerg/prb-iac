AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Ubuntu 24.04 dev box with chezmoi dotfiles and Tailscale.
  Prereqs (SG + IAM) must be deployed first — see prereqs.yaml.

# =============================================================================
# Deployment
# =============================================================================
#
#   # 1. Store secrets in SSM (one-time)
#   aws ssm put-parameter --name /prb-agents/github-token      --type SecureString --value "ghp_..."
#   aws ssm put-parameter --name /prb-agents/tailscale-auth-key --type SecureString --value "tskey-auth-..."
#
#   # 2. Deploy prereqs (one-time)
#   aws cloudformation deploy \
#     --template-file prereqs.yaml \
#     --stack-name prb-agents-prereqs \
#     --capabilities CAPABILITY_NAMED_IAM
#
#   # 3. Deploy instance
#   aws cloudformation deploy \
#     --template-file template.yaml \
#     --stack-name prb-agents \
#     --parameter-overrides KeyName=ssh
#
#   # 4. Check UserData progress
#   ssh ubuntu@<ip> tail -f /var/log/user-data.log
#

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: SSH key pair for the instance

  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Default: ""
    Description: >-
      Leave empty to use the exported value from prb-agents-prereqs stack.
      Set explicitly to override.

  InstanceProfileName:
    Type: String
    Default: ""
    Description: >-
      Leave empty to use the exported value from prb-agents-prereqs stack.
      Set explicitly to override.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-056574513ac9c1846
    Description: Subnet in the default VPC (us-east-1a)

  InstanceType:
    Type: String
    Default: t3.large

  AmiId:
    Type: AWS::EC2::Image::Id
    Default: ami-0ec10929233384c7f
    Description: Ubuntu 24.04 LTS amd64 (us-east-1, 2026-03-13)

  VolumeSize:
    Type: Number
    Default: 50
    Description: Root EBS volume size in GB

  GitHubToken:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /prb-agents/github-token
    NoEcho: true

  TailscaleAuthKey:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /prb-agents/tailscale-auth-key
    NoEcho: true

Conditions:
  UsePrerequsSG: !Equals [!Ref SecurityGroupId, ""]
  UsePrereqsProfile: !Equals [!Ref InstanceProfileName, ""]

Resources:
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !If
          - UsePrerequsSG
          - !ImportValue prb-agents-sg-id
          - !Ref SecurityGroupId
      IamInstanceProfile: !If
        - UsePrereqsProfile
        - !ImportValue prb-agents-instance-profile
        - !Ref InstanceProfileName
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: gp3
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee /var/log/user-data.log | logger -t user-data) 2>&1

          export DEBIAN_FRONTEND=noninteractive

          GITHUB_TOKEN='${GitHubToken}'
          TAILSCALE_KEY='${TailscaleAuthKey}'

          echo ">>> System packages"
          apt-get update -y
          apt-get upgrade -y
          apt-get install -y \
            build-essential curl git jq unzip wget \
            software-properties-common apt-transport-https

          # --- Git credentials (stored so 'git clone/push' just works) ---
          echo ">>> Configuring git credentials"
          sudo -u ubuntu git config --global credential.helper store
          echo "https://PaulRBerg:$GITHUB_TOKEN@github.com" > /home/ubuntu/.git-credentials
          chown ubuntu:ubuntu /home/ubuntu/.git-credentials
          chmod 600 /home/ubuntu/.git-credentials

          # --- Persist env vars ---
          echo ">>> Setting environment variables"
          cat >> /home/ubuntu/.bashrc <<'ENVEOF'

          # prb-agents managed
          export GITHUB_TOKEN='${GitHubToken}'
          ENVEOF

          # --- chezmoi + dotfiles ---
          echo ">>> Installing chezmoi"
          sudo -u ubuntu mkdir -p /home/ubuntu/.local/bin
          curl -fsLS get.chezmoi.io | sudo -u ubuntu sh -s -- -b /home/ubuntu/.local/bin

          echo ">>> Cloning dotfiles"
          sudo -u ubuntu mkdir -p /home/ubuntu/.local/share
          sudo -u ubuntu git clone \
            "https://PaulRBerg:$GITHUB_TOKEN@github.com/PaulRBerg/dotfiles.git" \
            /home/ubuntu/.local/share/chezmoi

          echo ">>> Running bootstrap_ubuntu.sh"
          cd /home/ubuntu/.local/share/chezmoi
          sudo -u ubuntu bash bootstrap_ubuntu.sh

          # --- Tailscale ---
          echo ">>> Installing Tailscale"
          curl -fsSL https://tailscale.com/install.sh | sh
          tailscale up --authkey="$TAILSCALE_KEY"

          echo ">>> Setup complete at $(date)"

Outputs:
  InstanceId:
    Value: !Ref Instance
  PublicIp:
    Value: !GetAtt Instance.PublicIp
    Description: SSH target — ubuntu@<this-ip>
  PrivateIp:
    Value: !GetAtt Instance.PrivateIp
